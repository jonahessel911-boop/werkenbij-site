<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vrienden van vrienden | €250 korting | Batterijconcept.nl</title>
  <meta name="description" content="€250 eenmalige korting via Vrienden van vrienden. Vraag aan via deze pagina en vermeld van wie je het kaartje hebt gekregen." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="site-header is-solid">
    <div class="container nav-bar">
      <a class="logo" href="/" aria-label="Batterijconcept home">
        <img src="/images/logo.png" alt="Batterijconcept" />
      </a>
      <button class="menu-toggle" type="button" aria-label="Menu" aria-expanded="false">☰</button>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li class="nav-item advies">
          <button class="nav-trigger" type="button">
            Advies
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="mega">
            <div class="mega-tabs">
              <a href="/producten">
                <strong>Producten</strong>
                <span>Alpha ESS batterijen &amp; groottes</span>
              </a>
              <a href="/advies-aan-huis">
                <strong>Advies aan huis</strong>
                <span>Gratis adviseur langs</span>
              </a>
            </div>
          </div>
        </li>
        <li><a href="/over-ons">Over ons</a></li>
        <li><a href="/contact">Contact</a></li>
      </ul>
      <a class="nav-phone" href="tel:0858001645"><span class="check">✓</span> 085 800 1645</a>
    </div>
  </header>

  <main>
    <section class="page-hero vrienden-hero">
      <div class="container" style="max-width: 640px;">
        <h1>€250 korting als je aanvraagt via deze pagina!</h1>
        <div class="form-panel vrienden-form-panel" style="margin-top: 1.5rem;">
          <form class="form-grid" data-vrienden-form>
            <div class="field">
              <label for="naam">Jouw naam*</label>
              <input id="naam" name="naam" placeholder="Voor- en achternaam" required autocomplete="name" />
            </div>
            <div class="form-row cols-2">
              <div class="field">
                <label for="postcode">Postcode*</label>
                <input id="postcode" name="postcode" placeholder="1234 AB" required autocomplete="postal-code" />
              </div>
              <div class="field">
                <label for="huisnr">Huisnummer*</label>
                <input id="huisnr" name="huisnr" placeholder="12" required />
              </div>
            </div>
            <div class="field">
              <label for="referrer">Van wie heb je dit kaartje gekregen?* (naam)</label>
              <input id="referrer" name="referrer" placeholder="Naam van de bestaande klant" required />
            </div>
            <div class="field">
              <label for="email">E-mail*</label>
              <input id="email" name="email" type="email" placeholder="naam@email.nl" required autocomplete="email" />
            </div>
            <div class="field">
              <label for="telefoon">Telefoon*</label>
              <input id="telefoon" name="telefoon" type="tel" placeholder="06 12345678" required autocomplete="tel" />
            </div>
            <button class="btn btn-green btn-wide" type="submit">Claim €250 korting</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
